server {
    listen 80;
    server_name yourdomain.in www.yourdomain.in;
    return 301 https://yourdomain.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.in;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.in/privkey.pem;

    root /var/www/baskrwado/frontend/dist;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
