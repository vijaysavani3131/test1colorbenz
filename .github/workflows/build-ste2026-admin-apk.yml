name: Build STE 2026 Admin APK

on:
  push:
    branches:
      - ste2026-admin-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: STE2026AdminAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STE2026Admin-debug-apk
          path: STE2026AdminAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
