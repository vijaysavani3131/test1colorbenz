server {
    listen 80;
    server_name api.yourdomain.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.in;

    # Configure certificates through Certbot / your infrastructure provider.
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.in/privkey.pem;

    root /var/www/baskrwado/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\. {
        deny all;
    }

    # Sensitive evidence lives under storage/app/private and is intentionally
    # outside the public document root. Never add an alias to that directory.
}
