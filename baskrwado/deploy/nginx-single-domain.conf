server {
    listen 80;
    server_name baskarwado.isavgo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name baskarwado.isavgo.com;

    # Replace with the certificate paths created by Certbot / your provider.
    ssl_certificate     /etc/letsencrypt/live/baskarwado.isavgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baskarwado.isavgo.com/privkey.pem;

    # React production build is the public document root.
    root /var/www/baskrwado/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Static Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything under /api is handled by Laravel's front controller while
    # keeping the original request URI, e.g. /api/cases or /api/webhooks/whatsapp.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/baskrwado/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/baskrwado/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120;
    }

    # Laravel health endpoint is outside /api.
    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/baskrwado/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/baskrwado/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Do not execute arbitrary PHP from the React document root.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # React SPA fallback for all non-API routes, including /admin and /track.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Laravel private evidence remains outside every public document root.
    # Never create an alias to /var/www/baskrwado/backend/storage/app/private.
}
